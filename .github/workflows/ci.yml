name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: make test
      - run: make build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make build
      - name: Relay starten
        run: |
          ./bin/nullraum serve -addr 127.0.0.1:8080 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
      - name: Playwright installieren
        working-directory: test/e2e
        run: npm install && npx playwright install --with-deps chromium
      - name: Drei-Nutzer-Test
        working-directory: test/e2e
        run: mkdir -p shots && SHOTS=shots node e2e.mjs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: test/e2e/shots
          if-no-files-found: ignore
